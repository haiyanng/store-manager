<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Store Manager — Bản thiết kế giao diện</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-mark">s<span>m</span></span><span>storemanager<span class="brand-caption">MỌI VIỆC TRONG TẦM TAY</span></span></a>
    <nav id="navigation" aria-label="Điều hướng chính"></nav>
    <div class="sidebar-bottom"><div class="store-icon">S</div><div><strong>Cửa hàng của bạn</strong><small>Không gian làm việc</small></div><span class="live-dot"></span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Mở menu">☰</button>
      <div class="breadcrumb">Không gian làm việc <span>/</span> <strong id="breadcrumb">Tổng quan</strong></div>
      <div class="top-actions"><span class="preview-label"><i></i>Bản xem trước · dữ liệu mẫu</span><button class="icon-button" id="notifications" aria-label="Thông báo"></button><span class="divider"></span><div class="avatar">MA</div><div class="profile"><strong>Minh Anh</strong><small>Chủ cửa hàng</small></div></div>
    </header>
    <main id="content" tabindex="-1"></main>
    <footer>Store Manager <span>Được thiết kế cho những ngày làm việc hiệu quả hơn.</span><span>Thiết kế đề xuất / 2026</span></footer>
  </div>
  <dialog id="dialog"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="close-dialog" aria-label="Đóng">✕</button></div><div id="dialog-content"></div><div id="dialog-actions" class="dialog-actions"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
